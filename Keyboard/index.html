<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard Testing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="power-container">
        <div class="heading">
            <h1 class="displayKey">Keyboard Tester</h1>
        </div>
        <div class="container">
            <div class="all">
                <div class="row1">
                    <input type="button" value="Esc" class="esc" id="btn">
                    <input class="space f1" type="button" value="F1" id="btn">
                    <input type="button" value="F2" class="f2" id="btn">
                    <input type="button" value="F3" class="f3" id="btn">
                    <input class="space f4" type="button" value="F4" id="btn">
                    <input type="button" class="f5" value="F5" id="btn">
                    <input type="button" class="f6" value="F6" id="btn">
                    <input type="button" class="f7" value="F7" id="btn">
                    <input type="button" class="f8" value="F8" id="btn">
                    <input class="space f9" type="button" value="F9" id="btn">
                    <input type="button" class="f10" value="F10" id="btn">
                    <input type="button" class="f11" value="F11" id="btn">
                    <input type="button" class="f12" value="F12" id="btn">
                    <input type="button" value="Home" id="btn" class="right-space-2 home">
                    <input type="button" value="Pg Up" class="pageUp" id="btn">
                    <input type="button" value="Ps Br" class="pauseBreak" id="btn">   
                    <input type="button" value="Prt Sc" class="printScreen" id="btn">
                    <input type="button" value="Scr Lk" class="screenLock" id="btn">
                </div>
                <div class="row2">
                    <input type="button" value="` ~" id="btn" class="tilt-sign">
                    <input type="button" value="1" id="btn" class="rowNumOne">
                    <input type="button" value="2" id="btn" class="rowNumTwo">
                    <input type="button" value="3" id="btn" class="rowNumThree">
                    <input type="button" value="4" id="btn" class="rowNumFour">
                    <input type="button" value="5" id="btn" class="rowNumFive">
                    <input type="button" value="6" id="btn" class="rowNumSix">
                    <input type="button" value="7" id="btn" class="rowNumSeven">
                    <input type="button" value="8" id="btn" class="rowNumEight">
                    <input type="button" value="9" id="btn" class="rowNumNine">
                    <input type="button" value="0" id="btn" class="rowNumZero">
                    <input type="button" value="- _" id="btn" class="hipen-sign">
                    <input type="button" value="+ =" id="btn" class="plusEqual-sign">
                    <input type="button" class="diff-btn backspace" value="Backspace" id="backspace">
                    <input type="button" class="right-space-2 endKey" value="End" id="btn">
                    <input type="button" value="Pg Dn" class="pageDown" id="btn">
                    <input type="button" value="N Lock" class="numLock" id="btn">
                    <input type="button" style="font-size: 18px;" value="/" class="numSlash" id="btn">  
                    <input type="button" style="font-size: 18px;" value="*" class="numAsterisk" id="btn">          
                </div>
        
                <div class="row3">
                    <input type="button" class="diff-btn tabKey" value="Tab" id="tab">
                    <input type="button" value="Q"  class="q" id="btn">
                    <input type="button" value="W" class="w" id="btn">
                    <input type="button" value="E" class="e" id="btn">
                    <input type="button" value="R" class="r" id="btn">
                    <input type="button" value="T" class="t" id="btn">
                    <input type="button" value="Y" class="y" id="btn">
                    <input type="button" value="U" class="u" id="btn">
                    <input type="button" value="I" class="i" id="btn">
                    <input type="button" value="O" class="o" id="btn">
                    <input type="button" value="P" class="p" id="btn">
                    <input type="button" value="[ {" id="btn" class="sqBracket">
                    <input type="button" value="} ]" id="btn" class="curlyBracket">
                    <input type="button" value="\ |" id="btn" class="pipeSign">
                    <input type="button" class="right-space-2 insert" value="Insert" id="btn">
                    <input type="button" value="7" class="numPadSeven" id="btn">
                    <input type="button" value="8" class="numPadEight" id="btn">
                    <input type="button" value="9" class="numPadNine" id="btn">
                    <input type="button" style="font-size: 18px;" class="numPadPlus" value="+" id="btn">
                </div>
        
                <div class="row4">
                    <input type="button" class="diff-btn capsLock" value="Caps Lock" id="cl">
                    <input type="button" value="A" class="a" id="btn">
                    <input type="button" value="S" class="s" id="btn">
                    <input type="button" value="D" class="d" id="btn">
                    <input type="button" value="F" class="f" id="btn">
                    <input type="button" value="G" class="g" id="btn">
                    <input type="button" value="H" class="h" id="btn">
                    <input type="button" value="J" class="j" id="btn">
                    <input type="button" value="K" class="k" id="btn">
                    <input type="button" value="L" class="l" id="btn">
                    <input type="button" value="; :" class="colons" id="btn">
                    <input type="button" value="&quot; ' " class="qout" id="btn">
                    <input type="button" class="diff-btn enter" value="Enter" id="enter">
                    <input type="button" class="right-space-2 del" value="Delete" id="btn">
                    <input type="button" value="4" class="numPadFour" id="btn">
                    <input type="button" value="5" class="numPadFive" id="btn">
                    <input type="button" value="6" class="numPadSix" id="btn">
                    <input type="button" style="font-size: 18px;" class="numPadMinus" value="-" id="btn">
                </div>
    
                <div class="row5">
                    <input type="button" class="diff-btn shift" value="Shift" id="shift">
                    <input type="button" value="Z" class="z" id="btn">
                    <input type="button" value="X" class="x" id="btn">
                    <input type="button" value="C" class="c" id="btn">
                    <input type="button" value="V" class="v" id="btn">
                    <input type="button" value="B" class="b" id="btn">
                    <input type="button" value="N" class="n" id="btn">
                    <input type="button" value="M" class="m" id="btn">
                    <input type="button" value=", &lt;" class="lessThan" id="btn">
                    <input type="button" value=". &gt;" class="greaterThan" id="btn">
                    <input type="button" value="/ ?" id="btn" class="questionSign">
                    <input type="button" class="diff-btn shift2" value="Shift" id="shift2">
                    <input type="button" class="right-space-2 upArrow" style="font-size: 18px;" value="&#x2191;" id="btn">
                    <input type="button" value="1" class="numPadOne" id="btn">
                    <input type="button" value="2" class="numPadTwo" id="btn">
                    <input type="button" value="3" class="numPadThree" id="btn">
                    <input type="button" class="diff-btn enter2" value="Enter" id="btn">
                </div>
        
                <div class="row6">
                    <input type="button" class="control" value="Ctrl" id="btn">
                    <input type="button" class="win" value="Win" id="btn">
                    <input type="button" class="alt" value="Alt" id="btn">
                    <input type="button" class="diff-btn spacebar" value="Spacebar" id="spacebar">
                    <input type="button" value="Alt" id="btn" class="alt2">
                    <input type="button" value="FN" id="btn" class="rightClick">
                    <input type="button" value="Ctrl" id="btn" class="control2">
                    <input type="button" class="leftArrow" style="font-size: 18px;" value="&#x2190;" id="btn">
                    <input type="button" value="&#x2193;" class="downArrow" style="font-size: 18px;" id="btn">
                    <input type="button" value="&#x2192;" class="rightArrow" style="font-size: 18px;" id="btn">
                    <input type="button" value="0" class="zero" id="btn">
                    <input type="button" value="." class="dot" id="btn">
                    <input type="button" class="metaKey" value="Meta" id="btn">
                </div>
            </div>
        </div><br><br>
        <footer>&copy;Shohag Kumar</footer>
    </section>

    <script src="keyboard.js"></script>
</body>
</html>
