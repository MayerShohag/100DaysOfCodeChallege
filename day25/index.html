<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Number Generator</title>
    <link rel="stylesheet" href="style.css" />

    <!-- boostrape css link  -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <section
      class="container border rounded-2 p-2 container-section row row-cols-sm-1 row-cols-md-2 row-cols-lg-2 mx-auto"
    >
      <form class="col border rounded-2" id="form">
        <h1 class="fs-1 text-center fw-bold">Random Number Generator</h1>
        <input
          required
          id="minNumber"
          type="number"
          name="minNumber"
          placeholder="Enter Min Range"
          class="minNumber form-control my-1"
        />
        <input
          required
          id="maxNumber"
          type="number"
          name="maxNumber"
          placeholder="Enter Max Range"
          id="maxNumber"
          class="maxNumber form-control my-1"
        />
        
        <div class="buttons my-1 row row-cols-lg-2 row-cols-md-2 row-cols-sm-1">
          <div class="generate-btn w-75">
            <button class="btn btn-warning w-100" id="submit">Generate</button>
          </div>
          <div class="reset-btn w-25">
            <button type="reset" class="btn btn-danger w-100">Clear</button>
          </div>
        </div>
      </form>
      <section class="col border rounded-2">
        <div class="comprehensive-version">
          <div class="text-center border-1 rounded-2 mt-3">
            <h3>Here is your result</h3>
            <div class="result d-flex justify-content-center fs-1 fw-bold" id="result">RESULT</div>
          </div>
        </div>
      </section>
    </section>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    <script src="app.js"></script>
  </body>
</html>
